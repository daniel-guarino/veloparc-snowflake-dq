version: 2

models:
  - name: stg_master_data
    description: Master data messages (customer, depot, partner) without technical duplicates or resends.
    columns:
      - name: entity
        data_tests:
          - accepted_values:
              arguments: {values: [customer, depot, partner]}
  - name: stg_tariffs
    description: Tariff messages without technical duplicates or resends; weight bands as an array.
  - name: stg_crm_objects
    description: CRM lead and opportunity messages without technical duplicates or resends.
    columns:
      - name: object_type
        data_tests:
          - accepted_values:
              arguments: {values: [Lead, Opportunity]}
  - name: stg_veloship_shipments
    description: VeloShip shipment messages without technical duplicates or resends.
  - name: stg_tracking_events
    description: Scan events without technical duplicates or resends; SSCC rebuilt from the EPC URN.
  - name: stg_invoices
    description: Invoice and credit note messages without technical duplicates or resends.
  - name: stg_partner_settlements
    description: Partner settlement messages without technical duplicates or resends.
  - name: stg_gl_extract
    description: GL extract rows without technical duplicates or resends.
