# Topics as designed in docs/architecture/ingestion_kafka_s3_bronze.md. `transport` says how the topic reaches
# Snowflake in the live setup (ADR 0003): kafka = Aiven (2 partitions, within free-tier limits), consumed by the
# Aiven Snowflake sink; file = extract uploaded to the internal stage @BRONZE.LANDING in the S3 Sink layout.
# The backfill writes every topic as files, in that layout and envelope; `publish` sends kafka topics to Aiven.
# `partitions` is the effective count used by the partitioner (Aiven: 2 for kafka topics).
# cleanup_policy / retention_hours / max_message_bytes are applied to kafka topics by `veloparc-gen kafka-setup`
# on Professional plans. On the Aiven Developer/Free tiers the plan fixes them (retention 1-3 days, replication 1)
# and refuses custom topic configs, so topics get the plan defaults and LogAppendTime is set at service level.
topics:
  veloship_shipment:
    name: vlp.shipping.veloship-shipment.v1
    transport: kafka
    partitions: 2
    landing: hour
    key: messageId
    schema: veloship_shipment.schema.json
    producer: veloship-api
    entity: shipment
    retention_hours: 168
  tracking_event:
    name: vlp.ops.tracking-event.v1
    transport: kafka
    partitions: 2
    landing: hour
    key: trackId
    schema: tracking_event.schema.json
    producer: scan-gateway
    entity: tracking_event
    retention_hours: 168
  invoice:
    name: vlp.finance.invoice.v1
    transport: kafka
    partitions: 2
    landing: hour
    key: invoiceNumber
    schema: invoice.schema.json
    producer: billing
    entity: invoice
    retention_hours: 720
    max_message_bytes: 4194304   # invoices can carry up to 5,000 lines
  crm_object:
    name: vlp.sales.crm-object.v1
    transport: kafka
    partitions: 2
    landing: hour
    key: Id
    schema: crm_object.schema.json
    producer: crm
    entity: crm_object
    cleanup_policy: compact,delete
    retention_hours: 720
  partner_settlement:
    name: vlp.ops.partner-settlement.v1
    transport: file
    partitions: 1
    landing: day
    key: settlementId
    schema: partner_settlement.schema.json
    producer: partner-portal
    entity: partner_settlement
  tariff:
    name: vlp.pricing.tariff.v1
    transport: file
    partitions: 3
    landing: hour
    key: tariffId
    schema: tariff.schema.json
    producer: pricing
    entity: tariff
  gl_extract:
    name: vlp.finance.gl-extract.v1
    transport: file
    partitions: 1
    landing: day
    key: company_code|period|gl_account
    schema: gl_extract_row.schema.json
    producer: erp
    entity: gl_extract_row
  master_data:
    name: vlp.mdm.master-data.v1
    transport: file
    partitions: 3
    landing: hour
    key: entity:natural_key
    schema: master_data.schema.json
    producer: mdm
    entity: master_data
  dlq:
    name: vlp.dlq.s3-sink.v1
    transport: kafka
    partitions: 2
    landing: hour
    key: original key
    schema: null
    producer: kafka-connect-s3-sink
    entity: dead_letter
    retention_hours: 336
