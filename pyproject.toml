[project]
name = "veloparc-gen"
version = "0.1.0"
description = "Synthetic data generator for the Veloparc data quality case (fictitious parcel carrier)."
readme = "generator/README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka==2.16.2",
    "faker==40.63.0",
    "jsonschema[format]==4.26.0",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    "snowflake-connector-python==5.2.0",
    "typer==0.29.2",
]

[project.scripts]
veloparc-gen = "veloparc_gen.cli:app"

[dependency-groups]
dev = [
    "check-jsonschema==0.39.0",
    "dbt-core==1.12.3",
    "dbt-snowflake==1.12.5",
    "detect-secrets==1.5.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator/src/veloparc_gen"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["out", "state"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = [
    "S311", # pseudo-random generators are the point of a data generator
]

[tool.ruff.lint.isort]
known-first-party = ["veloparc_gen"]

[tool.ruff.lint.per-file-ignores]
"generator/tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
addopts = "-ra --strict-markers"
